[project]
name = "geobench"
version = "0.2.0"
description = "Benchmark for how well LLMs geolocate images, through the context of GeoGuessr"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "verifiers==0.4.2.dev11",
    "shungite",
    "httpx",
    "python-dotenv",
    "charoite",
]

[project.scripts]
geobench = "geobench.launch:main"
dataset = "geobench.build:main"

[project.optional-dependencies]
viz = [
    "matplotlib",
    "pandas",
    "seaborn",
    "streamlit",
]

[dependency-groups]
dev = ["shungite[testing]", "pytest", "pytest-asyncio"]

[tool.uv.sources]
shungite = { path = "packages/shungite", editable = true }
charoite = { path = "packages/charoite", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geobench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
