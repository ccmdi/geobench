[project]
name = "geobench"
version = "0.2.0"
description = "Benchmark for how well LLMs geolocate images, through the context of GeoGuessr"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = [
    "verifiers==0.4.2.dev11",
    "shungite",
]

[project.optional-dependencies]
build = [
    "aiohttp",
    "numpy",
    "opencv-python",
    "Pillow",
    "python-dotenv",
]
viz = [
    "matplotlib",
    "pandas",
    "seaborn",
]

[dependency-groups]
dev = ["aiohttp", "pytest", "pytest-asyncio"]

[tool.uv.sources]
shungite = { path = "packages/shungite", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geobench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
